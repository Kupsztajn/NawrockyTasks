<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="public/styles/main.css">
    <link rel="stylesheet" href="public/styles/dashboard.css">
    <script src="public/scripts/main.js" defer></script>
    <title>PROJECT MEMBERS</title>
</head>
<body>
    <?php include 'navbar.php'; ?>
    <h1><?php echo htmlspecialchars($project->getName()); ?> - Members</h1>

    <div class="dashboard-container">
        <p><?php echo htmlspecialchars($project->getDescription()); ?></p>
        <small>📅 Created: <?php echo htmlspecialchars($project->getCreatedAt()); ?></small>

        <!-- Project Actions -->
        <div class="project-actions">
            <a href="/project?id=<?php echo htmlspecialchars($project->getId()); ?>" class="nav-btn back-btn">
                ← Back to Project
            </a>
        </div>

        <!-- Project Users Section -->
        <div class="project-users">
            <h2>👥 Project Members</h2>
            <?php if (isset($projectUsers) && count($projectUsers) > 0): ?>
                <div class="users-list">
                    <?php foreach ($projectUsers as $userInfo): ?>
                        <div class="user-item">
                            <div class="user-info">
                                <strong><?php echo htmlspecialchars($userInfo['user']->getEmail()); ?></strong>
                                <?php if ($userInfo['role'] === 'owner'): ?>
                                    <span class="user-badge owner-badge">👑 Owner</span>
                                <?php else: ?>
                                    <span class="user-badge member-badge">👤 Member</span>
                                <?php endif; ?>
                            </div>
                            <?php if ($isOwner && $userInfo['role'] !== 'owner'): ?>
                                <button class="remove-user-btn"
                                        data-project-id="<?php echo htmlspecialchars($project->getId()); ?>"
                                        data-user-id="<?php echo htmlspecialchars($userInfo['user']->getId()); ?>">
                                    ❌ Remove
                                </button>
                            <?php endif; ?>
                        </div>
                    <?php endforeach; ?>
                </div>
            <?php else: ?>
                <div class="user-item">
                    <em> No members in this project yet.</em>
                </div>
            <?php endif; ?>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const removeButtons = document.querySelectorAll('.remove-user-btn');

        removeButtons.forEach(button => {
            button.addEventListener('click', function() {
                const projectId = this.getAttribute('data-project-id');
                const userId = this.getAttribute('data-user-id');

                if (!confirm('Are you sure you want to remove this user from the project?')) {
                    return;
                }

                const formData = new FormData();
                formData.append('project_id', projectId);
                formData.append('user_id', userId);

                fetch('/remove-user', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('User removed successfully!');
                        location.reload();
                    } else {
                        alert('Error: ' + (data.error || 'Failed to remove user'));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while removing the user');
                });
            });
        });
    });
    </script>
</body>
</html>
