<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="public/styles/main.css">
    <link rel="stylesheet" href="public/styles/dashboard.css">
    <script src="public/scripts/main.js" defer></script>
    <script src="public/scripts/voice.js" defer></script>
    <title>PROJECT</title>
</head>
<body>
    <?php include 'navbar.php'; ?>
    <h1><?php echo htmlspecialchars($project->getName()); ?></h1>

    <div class="dashboard-container">
        <p><?php echo htmlspecialchars($project->getDescription()); ?></p>
        <small>Created: <?php echo htmlspecialchars($project->getCreatedAt()); ?></small>

        <!-- Project Members Button -->
        <div class="project-actions">
            <a href="/project-members?id=<?php echo htmlspecialchars($project->getId()); ?>" class="nav-btn members-btn">
                View Project Members
            </a>
        </div>

        <h2>Add Task to this Project</h2>
        <form action="/add-task" method="POST">
            <input type="hidden" name="project_id" value="<?php echo htmlspecialchars($project->getId()); ?>">
            <div style="display: flex; align-items: center; gap: 5px;">
                <input type="text" name="title" id="taskTitle" placeholder="Task Title" required>
                <button type="button" id="voiceBtn">🎤</button>
            </div>
            <textarea name="description" placeholder="Task Description"></textarea>
            <button type="submit">Add Task</button>
        </form>

        <div class="task-list">
            <h2>Tasks</h2>
            <?php if (isset($tasks) && count($tasks) > 0): ?>
                <?php foreach ($tasks as $task): ?>
                    <div class="task-item">
                        <strong><?php echo htmlspecialchars($task->getTitle()); ?></strong>
                        <p><?php echo htmlspecialchars($task->getDescription()); ?></p>
                        <small><?php echo $task->getStatus() === 'done' ? '✅' : '⏳'; ?> Status: <?php echo htmlspecialchars($task->getStatus()); ?> | Created: <?php echo htmlspecialchars($task->getCreatedAt()); ?></small>
                        <form action="/update-task-status" method="POST" style="display: inline;">
                            <input type="hidden" name="id" value="<?php echo htmlspecialchars($task->getId()); ?>">
                            <button type="submit"><?php echo $task->getStatus() === 'done' ? 'Mark as Pending' : '✅ Mark as Done'; ?></button>
                        </form>
                        <form action="/delete-task" method="POST" style="display: inline;">
                            <input type="hidden" name="id" value="<?php echo htmlspecialchars($task->getId()); ?>">
                            <button type="submit">Delete</button>
                        </form>
                    </div>
                <?php endforeach; ?>
            <?php else: ?>
                <div class="task-item">
                    <em>📝 No tasks in this project yet.</em>
                </div>
            <?php endif; ?>
        </div>
    </div>
</body>
</html>
